name: النشر الطبي اليومي

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: استدعاء مهمة النشر الآمنة
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$SCHEDULER_SECRET"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --max-time 180 \
            -X POST "${APP_URL%/}/tasks/daily-publish" \
            -H "Authorization: Bearer ${SCHEDULER_SECRET}" \
            -H "Content-Type: application/json"
